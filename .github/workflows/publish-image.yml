name: publish-image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static checks
        run: tests/static.sh

      - name: Resolve wrapper version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the candidate
        env:
          WRAPPER_VERSION: ${{ steps.ver.outputs.version }}
          VCS_REF: ${{ github.sha }}
          SP_RAILWAY_IMAGE: super-productivity-railway:candidate
        run: docker compose build --pull

      - name: Install the browser test runner
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Smoke tests against the candidate
        env:
          SP_RAILWAY_IMAGE: super-productivity-railway:candidate
          SP_TEST_OWNER_PASSWORD: ciOnlyOwnerPassword000
          BROWSER_E2E: '1'
        run: tests/smoke.sh

      - name: Persistence tests against the candidate
        env:
          SP_RAILWAY_IMAGE: super-productivity-railway:candidate
          SP_TEST_OWNER_PASSWORD: ciOnlyOwnerPassword000
        run: tests/persistence.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down test stack
        if: always()
        run: docker compose down -v --remove-orphans || true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          tags=("$VERSION")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tags+=("${VERSION%.*}" latest); fi
          for t in "${tags[@]}"; do
            docker tag super-productivity-railway:candidate "$IMAGE:$t"
            docker push -q "$IMAGE:$t"
          done
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          { echo "### Published image"; echo; echo "\`$digest\`"; } >> "$GITHUB_STEP_SUMMARY"
